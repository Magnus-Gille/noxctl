version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Without grouping, every dependency gets its own PR — which produced ten
    # open PRs, each touching package-lock.json, so merging any one forced the
    # rest to rebase. Batch the low-risk updates into one PR per week and leave
    # major bumps as individual PRs, since those are the ones worth reviewing
    # one at a time.
    # Keep Node type definitions aligned with the oldest supported runtime major.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      dev-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
