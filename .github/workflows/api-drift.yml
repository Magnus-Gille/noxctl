name: API Drift Check

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: api-drift-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs npm and repository code, so it holds no secret and no environment. The
  # tickets are filed by the separate report-tickets job below.
  check-api-spec:
    runs-on: ubuntu-latest
    outputs:
      diff_changed: ${{ steps.diff.outputs.changed }}
      diff_error: ${{ steps.diff.outputs.error }}
      diff_summary: ${{ steps.diff.outputs.summary }}
      schema_changed: ${{ steps.schema_audit.outputs.changed }}
      schema_error: ${{ steps.schema_audit.outputs.error }}
      schema_summary: ${{ steps.schema_audit.outputs.summary }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check for API changes
        id: diff
        run: |
          chmod +x scripts/check-api-changes.sh
          OUTPUT=$(bash scripts/check-api-changes.sh 2>&1) || EXIT_CODE=$?
          EXIT_CODE=${EXIT_CODE:-0}
          echo "$OUTPUT"

          {
            echo "summary<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -ne 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "error=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check MCP write-schema coverage
        id: schema_audit
        if: steps.diff.outputs.error != 'true'
        shell: bash
        run: |
          # This privileged weekly job needs dependencies for MCP discovery, but
          # dependency lifecycle scripts are unnecessary and must not run here.
          set +e
          npm ci --ignore-scripts --no-audit >/dev/null 2>&1
          INSTALL_EXIT_CODE=$?
          set -e

          if [ "$INSTALL_EXIT_CODE" -ne 0 ]; then
            # Keep the public diagnostic bounded. npm's raw output is not needed
            # to distinguish setup failure from schema drift.
            OUTPUT="Schema audit setup failed (npm ci exit $INSTALL_EXIT_CODE)."
            EXIT_CODE=2
          else
            set +e
            OUTPUT=$(npm run audit:schemas --silent 2>&1)
            EXIT_CODE=$?
            set -e
          fi

          echo "$OUTPUT"
          {
            echo "summary<<SCHEMA_AUDIT_EOF"
            echo "$OUTPUT"
            echo "SCHEMA_AUDIT_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "error=true" >> "$GITHUB_OUTPUT"
          fi

      # Last on purpose. A failure here still fails this job, but the tickets for
      # everything found above are filed by report-tickets, which runs regardless.
      - name: Check implementation coverage
        if: ${{ !cancelled() && steps.diff.outputs.error != 'true' && steps.schema_audit.outputs.error != 'true' }}
        run: npm run audit:api-coverage --silent

  # This job never writes to the repository: main is protected, and a rejected
  # push used to fail the job before any report was filed. The fingerprint is
  # refreshed in the pull request that handles the drift.
  #
  # Reports are Plane tickets in the NOX project, filed by the script (which also
  # deduplicates against open api-drift tickets). This is the only job that holds
  # the ticket gateway secrets. It runs no npm and no repository build or audit
  # code, only the dependency-free script, and it is a separate job so nothing
  # that ran in check-api-spec can reach the secrets through the runner.
  # The environment's deployment branch policy allows the default branch alone, so
  # a run from any other ref (including a workflow_dispatch from a branch) gets no
  # secret. The results of check-api-spec arrive as data, in environment variables.
  report-tickets:
    needs: check-api-spec
    # Without !cancelled() a failed check-api-spec (for example the coverage
    # check) would skip this job and silence the reports.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: plane-tickets
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # Fails the job, whatever the weekly checks found, when a secret is missing
      # or the gateway, token or NOX label does not work. Reports never fall back
      # to GitHub issues, and a week without drift proves nothing without this.
      - name: Verify ticket gateway access
        env:
          TICKET_GATEWAY_URL: ${{ secrets.TICKET_GATEWAY_URL }}
          TICKET_GATEWAY_TOKEN: ${{ secrets.TICKET_GATEWAY_TOKEN }}
        run: node scripts/file-plane-ticket.mjs check

      # Report steps use !cancelled() so one failed report cannot skip the others.
      - name: File ticket on API change
        if: ${{ !cancelled() && needs.check-api-spec.outputs.diff_changed == 'true' }}
        env:
          DIFF_SUMMARY: ${{ needs.check-api-spec.outputs.diff_summary }}
          TICKET_GATEWAY_URL: ${{ secrets.TICKET_GATEWAY_URL }}
          TICKET_GATEWAY_TOKEN: ${{ secrets.TICKET_GATEWAY_TOKEN }}
        run: node scripts/file-plane-ticket.mjs file drift

      - name: File ticket on fetch error
        if: ${{ !cancelled() && needs.check-api-spec.outputs.diff_error == 'true' }}
        env:
          DIFF_SUMMARY: ${{ needs.check-api-spec.outputs.diff_summary }}
          TICKET_GATEWAY_URL: ${{ secrets.TICKET_GATEWAY_URL }}
          TICKET_GATEWAY_TOKEN: ${{ secrets.TICKET_GATEWAY_TOKEN }}
        run: node scripts/file-plane-ticket.mjs file fetch-error

      - name: Report MCP write-schema audit
        if: ${{ !cancelled() && (needs.check-api-spec.outputs.schema_changed == 'true' || needs.check-api-spec.outputs.schema_error == 'true') }}
        env:
          SCHEMA_AUDIT_SUMMARY: ${{ needs.check-api-spec.outputs.schema_summary }}
          SCHEMA_AUDIT_CHANGED: ${{ needs.check-api-spec.outputs.schema_changed }}
          SCHEMA_AUDIT_ERROR: ${{ needs.check-api-spec.outputs.schema_error }}
          TICKET_GATEWAY_URL: ${{ secrets.TICKET_GATEWAY_URL }}
          TICKET_GATEWAY_TOKEN: ${{ secrets.TICKET_GATEWAY_TOKEN }}
        run: node scripts/file-plane-ticket.mjs file schema
