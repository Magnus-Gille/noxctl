name: API Drift Check

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: api-drift-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check-api-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check for API changes
        id: diff
        run: |
          chmod +x scripts/check-api-changes.sh
          OUTPUT=$(bash scripts/check-api-changes.sh 2>&1) || EXIT_CODE=$?
          EXIT_CODE=${EXIT_CODE:-0}
          echo "$OUTPUT"

          {
            echo "summary<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -ne 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "error=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check MCP write-schema coverage
        id: schema_audit
        if: steps.diff.outputs.error != 'true'
        shell: bash
        run: |
          # This privileged weekly job needs dependencies for MCP discovery, but
          # dependency lifecycle scripts are unnecessary and must not run here.
          set +e
          npm ci --ignore-scripts --no-audit >/dev/null 2>&1
          INSTALL_EXIT_CODE=$?
          set -e

          if [ "$INSTALL_EXIT_CODE" -ne 0 ]; then
            # Keep the public diagnostic bounded. npm's raw output is not needed
            # to distinguish setup failure from schema drift.
            OUTPUT="Schema audit setup failed (npm ci exit $INSTALL_EXIT_CODE)."
            EXIT_CODE=2
          else
            set +e
            OUTPUT=$(npm run audit:schemas --silent 2>&1)
            EXIT_CODE=$?
            set -e
          fi

          echo "$OUTPUT"
          {
            echo "summary<<SCHEMA_AUDIT_EOF"
            echo "$OUTPUT"
            echo "SCHEMA_AUDIT_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "error=true" >> "$GITHUB_OUTPUT"
          fi

      # This job never writes to the repository: main is protected, and a
      # rejected push used to fail the job before any issue was opened. The
      # fingerprint is refreshed in the pull request that handles the drift.
      - name: Open issue on API change
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DIFF_SUMMARY: ${{ steps.diff.outputs.summary }}
        with:
          script: |
            const summary = process.env.DIFF_SUMMARY;
            const today = new Date().toISOString().slice(0, 10);

            // Dedup: the same drift is detected every week until the committed
            // fingerprint is refreshed, so keep the history in one open issue.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'api-drift',
              per_page: 100,
            });
            const existing = open.find(
              (i) => !i.pull_request && i.title.startsWith('Fortnox API spec changed'),
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  'Still differs from the committed fingerprint on ' + today + ':',
                  '',
                  '```',
                  summary,
                  '```',
                ].join('\n'),
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Fortnox API spec changed (${today})`,
                body: [
                  'The weekly API drift check detected changes in the Fortnox OpenAPI spec.',
                  '',
                  '```',
                  summary,
                  '```',
                  '',
                  'Review the changes and update operations/tools if needed.',
                  '',
                  'The fingerprint is not updated automatically. Run `npm run check:api` locally to fetch the spec, inspect the actual diff, and commit the refreshed `api-spec/openapi-fingerprint.json` in the pull request that handles this change. The full Fortnox spec is not stored in the repo.',
                ].join('\n'),
                labels: ['api-drift'],
              });
            }

      - name: Open issue on fetch error
        if: ${{ !cancelled() && steps.diff.outputs.error == 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DIFF_SUMMARY: ${{ steps.diff.outputs.summary }}
        with:
          script: |
            const summary = process.env.DIFF_SUMMARY;
            const today = new Date().toISOString().slice(0, 10);

            // Dedup: the fetch can fail every week for the same reason (e.g. a
            // persistent HTTP 429). Rather than open a fresh issue each Monday,
            // append a comment to the existing open fetch-failure issue if one
            // exists, so the failure history lives in a single tracker.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'api-drift',
              per_page: 100,
            });
            const existing = open.find(
              (i) => !i.pull_request && /fetch failed|drift check|429/i.test(i.title),
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: ['Still failing on ' + today + ':', '', '```', summary, '```'].join('\n'),
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Fortnox API spec fetch failed (${today})`,
                body: [
                  'The weekly API drift check could not fetch the OpenAPI spec.',
                  '',
                  '```',
                  summary,
                  '```',
                  '',
                  'This may be transient (rate limiting) or indicate a URL change.',
                ].join('\n'),
                labels: ['api-drift'],
              });
            }

      - name: Report MCP write-schema audit
        if: ${{ !cancelled() && (steps.schema_audit.outputs.changed == 'true' || steps.schema_audit.outputs.error == 'true') }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SCHEMA_AUDIT_SUMMARY: ${{ steps.schema_audit.outputs.summary }}
          SCHEMA_AUDIT_CHANGED: ${{ steps.schema_audit.outputs.changed }}
          SCHEMA_AUDIT_ERROR: ${{ steps.schema_audit.outputs.error }}
        with:
          script: |
            const summary = process.env.SCHEMA_AUDIT_SUMMARY;
            const changed = process.env.SCHEMA_AUDIT_CHANGED === 'true';
            const errored = process.env.SCHEMA_AUDIT_ERROR === 'true';
            if (changed === errored) {
              core.setFailed('Expected exactly one write-schema audit outcome');
              return;
            }

            const today = new Date().toISOString().slice(0, 10);
            const title = changed ? 'MCP write schema drift' : 'MCP write schema audit failed';
            const introduction = changed
              ? 'The weekly check detected a change in the opaque MCP write-schema coverage baseline.'
              : 'The weekly MCP write-schema audit could not complete.';
            const guidance = changed
              ? 'Review the affected mapping IDs locally and update tool schemas before refreshing the opaque baseline.'
              : 'Inspect the workflow failure and restore the privacy-safe audit path.';
            const report = [
              introduction,
              '',
              '```text',
              summary,
              '```',
              '',
              guidance,
              '',
              'The full Fortnox specification and raw property names are intentionally not included.',
            ].join('\n');

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'api-drift',
              per_page: 100,
            });
            const existing = open.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [`Detected again on ${today}.`, '', report].join('\n'),
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: report,
                labels: ['api-drift'],
              });
            }

      # Last on purpose: a coverage failure must not suppress the reports above.
      # Report steps use !cancelled() so one failed report cannot skip the others.
      - name: Check implementation coverage
        if: ${{ !cancelled() && steps.diff.outputs.error != 'true' && steps.schema_audit.outputs.error != 'true' }}
        run: npm run audit:api-coverage --silent
